name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Ruff (src/ and tools/ only)
        run: |
          targets=()
          [ -d src ] && targets+=(src)
          [ -d tools ] && targets+=(tools)
          if [ ${#targets[@]} -gt 0 ]; then
            ruff check "${targets[@]}" \
              --exclude flysim.py,flysim_gpu.py,mushroom.py,mb_sides.py,build_graph.py,fly_drums_*.py,tools/gen_readme_assets.py
          else
            echo "No src/ or tools/ directory to lint"
          fi

      - name: Verify README image paths exist
        run: |
          python - <<'PY'
          import pathlib
          import re

          root = pathlib.Path('.')
          readme = (root / 'README.md').read_text(encoding='utf-8')
          paths = re.findall(r'(?:src|srcset)="([^"]+)"', readme)
          local_paths = [p for p in paths if not p.startswith(('http://', 'https://'))]

          missing = [p for p in local_paths if not (root / p).exists()]
          if missing:
            raise SystemExit('Missing README image path(s): ' + ', '.join(missing))

          print(f'Checked {len(local_paths)} local image path(s); all exist.')
          PY

      - name: Run pytest if tests exist
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No tests/ directory; skipping pytest"
          fi
